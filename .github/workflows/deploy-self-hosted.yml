name: Deploy Portal to EC2 (self-hosted)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo to portal path
        run: |
          sudo mkdir -p /opt/culture-escrow-site
          sudo rsync -az --delete --exclude='.env' ./ /opt/culture-escrow-site/
          sudo chown -R $USER:$USER /opt/culture-escrow-site

      - name: Install dependencies
        working-directory: /opt/culture-escrow-site
        run: npm install

      - name: Build portal
        working-directory: /opt/culture-escrow-site
        run: npm run build

      - name: Restart portal service
        run: sudo systemctl restart culture-portal.service

      - name: Verify portal service
        run: systemctl is-active culture-portal.service
